name: Build CAD Sync Grouping 0.4.3.7

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet restore .\src\CadSyncGrouping.AutoCAD\CadSyncGrouping.AutoCAD.csproj
          dotnet build .\src\CadSyncGrouping.AutoCAD\CadSyncGrouping.AutoCAD.csproj -c Release --no-restore

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out'
          $bundleRoot = Join-Path $root 'CadSyncGrouping.bundle'
          $win64 = Join-Path $bundleRoot 'Contents\Win64'
          New-Item -ItemType Directory -Force $win64 | Out-Null
          Copy-Item '.\bundle\CadSyncGrouping.bundle\PackageContents.xml' (Join-Path $bundleRoot 'PackageContents.xml')
          $dll = '.\src\CadSyncGrouping.AutoCAD\bin\Release\net10.0-windows\CadSyncGrouping2027V043.dll'
          Copy-Item $dll (Join-Path $win64 'CadSyncGrouping2027V043.dll')
          (Get-FileHash $dll -Algorithm SHA256).Hash + '  CadSyncGrouping2027V043.dll' | Set-Content (Join-Path $win64 'SHA256.txt')
          Compress-Archive -Path $bundleRoot -DestinationPath '.\CAD_Sync_Grouping_0.4.3.7_AutoLoad_Bundle.zip' -Force

          $srcStage = Join-Path $root 'source'
          New-Item -ItemType Directory -Force (Join-Path $srcStage 'src') | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $srcStage 'bundle') | Out-Null
          Copy-Item '.\src\CadSyncGrouping.AutoCAD' (Join-Path $srcStage 'src') -Recurse
          Copy-Item '.\bundle\CadSyncGrouping.bundle' (Join-Path $srcStage 'bundle') -Recurse
          Get-ChildItem $srcStage -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj') } | Remove-Item -Recurse -Force
          Compress-Archive -Path (Join-Path $srcStage '*') -DestinationPath '.\CAD_Sync_Grouping_0.4.3.7_Source.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CAD_Sync_Grouping_0.4.3.7
          path: |
            CAD_Sync_Grouping_0.4.3.7_AutoLoad_Bundle.zip
            CAD_Sync_Grouping_0.4.3.7_Source.zip
