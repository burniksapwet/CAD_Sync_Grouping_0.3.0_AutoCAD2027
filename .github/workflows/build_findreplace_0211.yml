name: Build and test Find and Replace Block 0.2.11
on:
  push:
    branches: [findreplace-0.2.11-select-block]
    paths:
      - 'build_overlay/select031/**'
      - 'build_overlay/Patch_FindAndReplace_031.py'
      - 'build_overlay/RELEASE_NOTES_031.md'
      - '.github/workflows/build_findreplace_0211.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stage checked 0.2.10 baseline and Select Block update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = (Get-Content .\build_input\fr021_00.txt -Raw) + (Get-Content .\build_input\fr021_01.txt -Raw) + (Get-Content .\build_input\fr021_02.txt -Raw) + (Get-Content .\build_input\fr021_03.txt -Raw)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'baseline.zip'),[Convert]::FromBase64String($b64))
          Expand-Archive .\baseline.zip .\work -Force
          $project = Get-ChildItem .\work -Recurse -Filter 'CadSyncFindAndReplaceBlock.csproj' | Select-Object -First 1
          if (-not $project) { throw 'Baseline missing.' }
          $projectDir = $project.Directory.FullName
          Copy-Item .\build_overlay\BlockFinderScanner_022.cs (Join-Path $projectDir 'BlockFinderScanner.cs') -Force
          Copy-Item .\build_overlay\TargetBlockDialog_023.cs (Join-Path $projectDir 'TargetBlockDialog.cs') -Force
          & .\build_overlay\Patch_FindAndReplace_024.ps1 -ProjectDir $projectDir
          python -X utf8 .\build_overlay\Patch_FindAndReplace_025.py .\work
          if ($LASTEXITCODE -ne 0) { throw '025 baseline failed.' }
          python -X utf8 .\build_overlay\Patch_FindAndReplace_026.py .\work
          if ($LASTEXITCODE -ne 0) { throw '026 baseline failed.' }
          Copy-Item .\build_overlay\tests025 .\work\tests -Recurse
          foreach ($patch in @('027','028','029','030','031')) {
            python -X utf8 ".\build_overlay\Patch_FindAndReplace_$patch.py" .\work
            if ($LASTEXITCODE -ne 0) { throw "Patch $patch failed." }
          }
          if (Test-Path .\work\README.md) { Move-Item .\work\README.md .\work\HISTORY.md }
          Copy-Item .\build_overlay\RELEASE_NOTES_030.md .\work\HISTORY_0210.md
          Copy-Item .\build_overlay\RELEASE_NOTES_031.md .\work\README.md
      - name: Set exact SDK release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = '.\work\src\CadSyncFindAndReplaceBlock'
          Remove-Item (Join-Path $dir 'AssemblyInfo.cs')
          $project = Join-Path $dir 'CadSyncFindAndReplaceBlock.csproj'
          $xml = [xml](Get-Content $project -Raw)
          $props = $xml.Project.PropertyGroup
          $props.GenerateAssemblyInfo = 'true'
          foreach ($pair in @(@('AssemblyVersion','0.2.11.0'),@('FileVersion','0.2.11.0'),@('InformationalVersion','0.2.11'),@('Company','DMG'),@('Product','Find and Replace Block'),@('Description','Combined block finder and replacement utility for AutoCAD 2027'))) {
            $node = $xml.CreateElement($pair[0])
            $node.InnerText = $pair[1]
            [void]$props.AppendChild($node)
          }
          $xml.Save((Join-Path $PWD $project))
      - name: Compile actual AutoCAD plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = '.\work\src\CadSyncFindAndReplaceBlock\CadSyncFindAndReplaceBlock.csproj'
          for ($attempt=1; $attempt -le 3; $attempt++) {
            dotnet restore $project
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Package restore failed after retries.' }
            Start-Sleep -Seconds 8
          }
          dotnet build $project -c Release --no-restore -p:WarningsAsErrors=CS7035 -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Plugin compilation failed.' }
      - name: Run selection, target picker, and Windows Forms scenarios
        shell: pwsh
        run: |
          dotnet run --project .\work\tests\SelectionTests.csproj -c Release 2>&1 | Tee-Object -FilePath .\SelectionResults.txt
          if ($LASTEXITCODE -ne 0) { throw 'Selection tests failed.' }
      - name: Run unchanged geometric regression scenarios
        shell: pwsh
        run: |
          dotnet run --project .\work\geometry_tests\GeometryTests.csproj -c Release 2>&1 | Tee-Object -FilePath .\GeometryResults.txt
          if ($LASTEXITCODE -ne 0) { throw 'Geometry tests failed.' }
      - name: Package exact tested source and DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = '.\out\FindAndReplaceBlock.bundle'
          $win64 = Join-Path $bundle 'Contents\Win64'
          New-Item -ItemType Directory -Force $win64 | Out-Null
          $dll = '.\work\src\CadSyncFindAndReplaceBlock\bin\Release\net10.0-windows\CadSyncFindAndReplaceBlock2027V0211.dll'
          if (-not (Test-Path $dll)) { throw 'Expected DLL missing.' }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll)).FileVersion
          if ($version -ne '0.2.11.0') { throw "Incorrect DLL version $version" }
          Copy-Item $dll $win64
          Copy-Item .\work\bundle\FindAndReplaceBlock.bundle\PackageContents.xml $bundle
          (Get-FileHash $dll -Algorithm SHA256).Hash + '  CadSyncFindAndReplaceBlock2027V0211.dll' | Set-Content (Join-Path $win64 'SHA256.txt')
          Copy-Item .\work\README.md .\out\README.md
          (Get-Content .\SelectionResults.txt -Raw) + [Environment]::NewLine + (Get-Content .\GeometryResults.txt -Raw) | Set-Content .\RegressionResults.txt
          Copy-Item .\RegressionResults.txt .\out\RegressionResults.txt
          Copy-Item .\RegressionResults.txt .\work\RegressionResults.txt
          Compress-Archive -Path .\out\* -DestinationPath .\FINDANDREPLACEBLOCK_0.2.11_AutoLoad_Bundle.zip -Force
          Get-ChildItem .\work -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj') } | Sort-Object { $_.FullName.Length } -Descending | Remove-Item -Recurse -Force
          Compress-Archive -Path .\work\* -DestinationPath .\FINDANDREPLACEBLOCK_0.2.11_Source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FINDANDREPLACEBLOCK_0.2.11
          if-no-files-found: error
          path: |
            FINDANDREPLACEBLOCK_0.2.11_AutoLoad_Bundle.zip
            FINDANDREPLACEBLOCK_0.2.11_Source.zip
            RegressionResults.txt
            ui_preview/Select_Block_Dialog.png
