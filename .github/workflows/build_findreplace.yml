name: Build Find and Replace Block 0.2.1

on:
  push:
    branches: [ findreplace-0.2.0 ]
    paths:
      - 'build_input/fr021_*.txt'
      - '.github/workflows/build_findreplace.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = (Get-Content .\build_input\fr021_00.txt -Raw) +
                 (Get-Content .\build_input\fr021_01.txt -Raw) +
                 (Get-Content .\build_input\fr021_02.txt -Raw) +
                 (Get-Content .\build_input\fr021_03.txt -Raw)
          [IO.File]::WriteAllBytes('.\FINDANDREPLACEBLOCK_0.2.1_Source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive '.\FINDANDREPLACEBLOCK_0.2.1_Source.zip' '.\work' -Force
          Get-ChildItem .\work -Recurse | Select-Object FullName

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-ChildItem .\work -Recurse -Filter 'CadSyncFindAndReplaceBlock.csproj' | Select-Object -First 1
          if (-not $project) { throw 'CadSyncFindAndReplaceBlock.csproj not found after reconstruction.' }
          dotnet restore $project.FullName
          dotnet build $project.FullName -c Release --no-restore

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-ChildItem .\work -Recurse -Filter 'CadSyncFindAndReplaceBlock.csproj' | Select-Object -First 1
          $projectDir = $project.Directory.FullName
          $dll = Get-ChildItem (Join-Path $projectDir 'bin\Release') -Recurse -Filter 'CadSyncFindAndReplaceBlock2027V021.dll' | Select-Object -First 1
          if (-not $dll) { throw 'Built plugin DLL not found.' }
          $manifest = Get-ChildItem .\work -Recurse -Filter 'PackageContents.xml' | Where-Object { $_.FullName -like '*FindAndReplaceBlock.bundle*' } | Select-Object -First 1
          if (-not $manifest) { throw 'PackageContents.xml not found.' }

          $bundleRoot = '.\out\FindAndReplaceBlock.bundle'
          $win64 = Join-Path $bundleRoot 'Contents\Win64'
          New-Item -ItemType Directory -Force $win64 | Out-Null
          Copy-Item $manifest.FullName (Join-Path $bundleRoot 'PackageContents.xml')
          Copy-Item $dll.FullName (Join-Path $win64 'CadSyncFindAndReplaceBlock2027V021.dll')
          (Get-FileHash $dll.FullName -Algorithm SHA256).Hash + '  CadSyncFindAndReplaceBlock2027V021.dll' | Set-Content (Join-Path $win64 'SHA256.txt')
          Compress-Archive -Path $bundleRoot -DestinationPath '.\FINDANDREPLACEBLOCK_0.2.1_AutoLoad_Bundle.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FINDANDREPLACEBLOCK_0.2.1
          path: |
            FINDANDREPLACEBLOCK_0.2.1_AutoLoad_Bundle.zip
            FINDANDREPLACEBLOCK_0.2.1_Source.zip
